server:
  port: 8083

spring:
  application:
    name: servicio-paquetes
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:h2:mem:paquetesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# JWT_SECRET se lee desde variable de entorno (o Vault). Sin valor por defecto.
jwt:
  secret: ${JWT_SECRET}

# Tarifas con valores por defecto (sobreescritas por Config Server)
tarifa:
  base:
    por-kg: 2.5
    por-km: 0.10
    minima: 5.0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

feign:
  circuitbreaker:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      clientes-cb:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        sliding-window-size: 5
        permitted-number-of-calls-in-half-open-state: 3
        # Un cliente inexistente (404) es un error de negocio, no una falla del servicio
        ignore-exceptions:
          - com.rapidocourier.paquetes.exception.ResourceNotFoundException
          - feign.FeignException$NotFound
  retry:
    instances:
      clientes-retry:
        max-attempts: 2
        wait-duration: 500ms
  timelimiter:
    instances:
      clientes-cb:
        timeout-duration: 5s

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    circuitbreakers:
      enabled: true
