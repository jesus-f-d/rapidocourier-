server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: git
  cloud:
    config:
      server:
        # Repositorio Git local con la configuración centralizada.
        # Ver README ("Config Server con repositorio Git") para crearlo a partir
        # de los archivos de src/main/resources/config-repo.
        git:
          uri: file:///${user.home}/rapidocourier-config
          default-label: main
          clone-on-start: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: "*"
